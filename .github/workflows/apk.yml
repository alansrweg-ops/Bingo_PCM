name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Abrir o projeto
        run: |
          if [ ! -f projeto-android/settings.gradle ]; then
            arquivo=$(find . -iname 'projeto*android*.zip' | head -n 1)
            if [ -z "$arquivo" ]; then
              echo "Arquivos encontrados no repositório:"
              find . -type f -not -path './.git/*'
              echo "::error::Falta o projeto-android.zip. Envie o arquivo em Add file > Upload files."
              exit 1
            fi
            echo "Abrindo $arquivo"
            unzip -o "$arquivo"
          fi
          test -f projeto-android/settings.gradle

      - name: Compilar o APK
        working-directory: projeto-android
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Bingo-do-PCM-APK
          path: projeto-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
